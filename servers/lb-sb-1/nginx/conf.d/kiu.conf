# --- kiu.dazytech.web.id (repo kiu, container kiu-app port 3000) ---
# Antrean digital restoran. Sertifikat Let's Encrypt diterbitkan & diperpanjang
# otomatis (deploy/apply.sh). Blok default_server 443 ada di wezy.conf.
server {
    listen 443 ssl;
    http2 on;
    server_name kiu.dazytech.web.id;

    ssl_certificate     /etc/letsencrypt/live/kiu.dazytech.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiu.dazytech.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log main_ext;

    # Upload terbesar: logo bisnis (maks 400 KB) & gambar promo TV (maks 900 KB),
    # sudah diperkecil di browser. 2 MB memberi ruang untuk overhead multipart.
    client_max_body_size 2m;

    # Header respons Next (CSP ber-nonce, cookie sesi, RSC) bisa melebihi buffer
    # bawaan 4k/8k -> 502 "upstream sent too big header" (pelajaran dazytech & osrm).
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # Kompresi oleh Next (bawaan). Respons yang sudah ber-Content-Encoding tidak
    # dikompres ulang nginx; SSE dikirim app dengan Cache-Control no-transform.

    set $kiu_upstream http://kiu-app:3000;

    # --- Tolak URL khas scanner sebelum sampai ke Next (pola sama dengan wezy.conf) ---
    location ~* (?:/\.(?!well-known/)|\.(?:php\d?|phtml|asp|aspx|jsp|cgi|py|sql|bak|old|orig|swp|ini|cfg|conf|ya?ml|env)$|/(?:wp-admin|wp-content|wp-includes|wp-json|wp-login|xmlrpc|phpmyadmin|cgi-bin)) {
        return 444;
    }

    # --- Server-Sent Events: konsol host, layar TV, halaman ambil nomor & tiket ---
    # /api/<q|t|display|console>/<id>/stream/. Event harus langsung diteruskan
    # (tanpa buffer); app mengirim ping tiap 20 detik dan menutup koneksi sendiri
    # secara berkala, jadi timeout 1 jam cukup longgar.
    location ~ ^/api/[^/]+/[^/]+/stream/$ {
        proxy_pass $kiu_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass $kiu_upstream;
        proxy_http_version 1.1;
        # Host asli wajib diteruskan: dipakai cek Origin (server action & POST API).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        # IP asli SAJA: rate limit ambil antrean & login memakai X-Real-IP
        # (src/lib/http.ts di repo kiu), jadi tidak boleh bisa dipalsukan klien.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_read_timeout 120s;
    }
}
