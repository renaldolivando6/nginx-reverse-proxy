# --- KONFIGURASI GLOBAL: SERVER AWS LB-SB-1 (wezy.dazytech.web.id) ---
# Di-include dari block http{} nginx:alpine. Prefix "00-" supaya terbaca lebih
# dulu dari file lain yang memakai log_format di bawah.

server_tokens off;

# Upstream dipanggil lewat variabel + resolver DNS Docker: nginx tetap bisa start
# walau wezy-app belum jalan (deploy pertama, atau app sedang diganti), dan alamat
# container baru terbaca tanpa reload. Tanpa ini nginx gagal start dengan
# "host not found in upstream", dan setelah wezy-app dibuat ulang nginx masih
# menembak IP lama sampai di-reload.
resolver 127.0.0.11 valid=10s ipv6=off;

# --- FORMAT LOG ---
# Sama dengan server AWS utama (lihat nginx/conf.d/00-global.conf di root repo)
# supaya perintah awk yang sama tetap berlaku. Dipasang per server block.
log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host rt=$request_time urt="$upstream_response_time" lr=$limit_req_status';
