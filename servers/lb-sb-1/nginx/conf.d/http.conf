# --- PORT 80 ---
# Saat sertifikat belum ada (deploy pertama), deploy/apply.sh menyalakan nginx
# HANYA dengan 00-global.conf + file ini supaya certbot bisa memvalidasi domain.
# Jadi JANGAN taruh blok 443 di file ini.

# Host tak dikenal (akses langsung via IP, domain lain) ditutup tanpa jawaban.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log main_ext;
    return 444;
}

# HTTP -> HTTPS. acme-challenge untuk certbot (webroot): terbit pertama dan
# setiap perpanjangan.
server {
    listen 80;
    server_name wezy.dazytech.web.id;
    access_log /var/log/nginx/access.log main_ext;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
