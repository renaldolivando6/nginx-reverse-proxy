# --- HTTPS ---
# Host tak dikenal (SNI lain atau kosong, akses via IP) ditolak saat handshake
# TLS, tanpa mengirim sertifikat apa pun.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# --- wezy.dazytech.web.id (repo wezy, container wezy-app port 3000) ---
# Sertifikat Let's Encrypt diterbitkan & diperpanjang otomatis (deploy/apply.sh).
server {
    listen 443 ssl;
    http2 on;
    server_name wezy.dazytech.web.id;

    ssl_certificate     /etc/letsencrypt/live/wezy.dazytech.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wezy.dazytech.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log main_ext;

    # Upload video sampul / film sampai 40 MB.
    client_max_body_size 41m;

    # Header respons Next (CSP ber-nonce, cookie sesi, RSC) bisa melebihi buffer
    # bawaan 4k/8k -> 502 "upstream sent too big header" (pelajaran dazytech & osrm).
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # Next 15.5 tidak mengompres respons route handler (/api/*). Daftar tamu
    # check-in sudah di-gzip oleh app sendiri; respons yang sudah ber-
    # Content-Encoding tidak dikompres ulang oleh nginx.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml text/calendar application/manifest+json;

    set $wezy_upstream http://wezy-app:3000;

    # --- Tolak URL khas scanner sebelum sampai ke Next ---
    # Pola sama dengan tebu (nginx/conf.d/default.conf di root repo). Wezy tidak
    # punya URL sah berakhiran ekstensi ini atau ber-awalan titik (semua URL
    # halaman diakhiri "/", media berekstensi gambar/video/audio).
    # 444 = koneksi ditutup tanpa jawaban.
    location ~* (?:/\.(?!well-known/)|\.(?:php\d?|phtml|asp|aspx|jsp|cgi|py|sql|bak|old|orig|swp|ini|cfg|conf|ya?ml|env)$|/(?:wp-admin|wp-content|wp-includes|wp-json|wp-login|xmlrpc|phpmyadmin|cgi-bin)) {
        return 444;
    }

    location / {
        proxy_pass $wezy_upstream;
        proxy_http_version 1.1;
        # Host asli wajib diteruskan: dipakai cek Origin (server action & upload).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        # IP asli SAJA, bukan rantai kiriman klien: rate limit login, PIN
        # check-in, dan formulir tamu memakai IP ini (src/lib/auth/session.ts di
        # repo wezy), jadi tidak boleh bisa dipalsukan lewat header X-Forwarded-For.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_read_timeout 120s;
    }
}
