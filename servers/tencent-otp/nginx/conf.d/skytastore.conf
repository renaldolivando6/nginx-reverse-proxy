# --- skytastore.dazytech.web.id (repo skyta-store, container skyta-app port 80) ---
# TANPA Cloudflare: DNS di Dewaweb, A record langsung ke IP server ini. Sertifikat
# Let's Encrypt diterbitkan & diperpanjang otomatis (deploy/apply.sh). $remote_addr
# adalah IP asli pengunjung; aplikasi memakainya untuk rate limit dan allowlist
# IP webhook Digiflazz (52.74.250.133), lewat TRUSTED_PROXIES = subnet web-network.
server {
    listen 443 ssl;
    http2 on;
    server_name skytastore.dazytech.web.id;

    ssl_certificate     /etc/letsencrypt/live/skytastore.dazytech.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skytastore.dazytech.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log main_ext;

    # Domain ini terbuka langsung ke internet (tanpa Cloudflare): batasi koneksi
    # bersamaan per IP dan putus klien yang mengirim header/body terlalu lambat.
    limit_conn skyta_conn 60;
    limit_conn_status 429;
    client_header_timeout 15s;
    client_body_timeout 15s;

    set $skyta_upstream http://skyta-app:80;

    # --- Tolak URL khas scanner sebelum sampai ke Laravel ---
    # Pola sama dengan otpnusantara.conf. Skyta tidak punya URL sah berakhiran
    # ekstensi ini atau ber-awalan titik (kecuali .well-known).
    location ~* (?:/\.(?!well-known/)|\.(?:php\d?|phtml|asp|aspx|jsp|cgi|py|sql|bak|old|orig|swp|ini|cfg|conf|ya?ml|env)$|/(?:wp-admin|wp-content|wp-includes|wp-json|wp-login|xmlrpc|phpmyadmin|cgi-bin)) {
        return 444;
    }

    # Aset Vite (nama berisi hash) dilayani nginx di skyta-app tanpa PHP: tidak dibatasi.
    location /build/ {
        proxy_pass $skyta_upstream;
        include /etc/nginx/conf.d/skyta-proxy.inc;
    }

    location / {
        limit_req zone=skyta_per_ip burst=40 nodelay;

        proxy_pass $skyta_upstream;
        include /etc/nginx/conf.d/skyta-proxy.inc;
        # Transaksi supplier bisa ditunggu sampai 40 detik di job, bukan di request
        # web; 60 detik cukup untuk halaman dan polling invoice.
        proxy_read_timeout 60s;
    }
}
