# --- KONFIGURASI GLOBAL: SERVER TENCENT (otpnusantara.com, skytastore.dazytech.web.id) ---
# Di-include dari block http{} nginx:alpine. Prefix "00-" supaya terbaca lebih
# dulu dari file situs yang memakai log_format, zona, dan variabel di bawah.

# Upstream dipanggil lewat variabel + resolver DNS Docker: nginx tetap bisa start
# walau container aplikasi belum jalan (deploy pertama, atau sedang diganti), dan
# alamat container baru terbaca tanpa reload. Tanpa ini, nginx gagal start dengan
# "host not found in upstream" dan urutan deploy jadi rapuh.
resolver 127.0.0.11 valid=10s ipv6=off;

# Batas upload disamakan dengan otp-app (nginx & php.ini: 8M).
client_max_body_size 8M;
server_tokens off;

# --- IP ASLI PENGUNJUNG DI BELAKANG CLOUDFLARE ---
# otpnusantara.com memakai proxy Cloudflare (awan oranye), jadi koneksinya datang
# dari IP Cloudflare. skytastore.dazytech.web.id TIDAK lewat Cloudflare: koneksinya
# langsung dari pengunjung, dan aturan di bawah tidak berlaku untuknya ($remote_addr
# tetap IP koneksi). IP pengunjung ada di header CF-Connecting-IP, dan header itu
# HANYA dipercaya dari rentang IP Cloudflare di bawah (request langsung ke IP server
# tidak bisa memalsukannya). Tanpa ini rate limit aplikasi (kode login, voucher) dan
# allowlist IP webhook HeroSMS melihat semua orang sebagai beberapa IP Cloudflare.
# Daftar resmi: https://www.cloudflare.com/ips/ (jarang berubah; perbarui bila berubah).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 1 bila KONEKSI (bukan header) datang dari Cloudflare atau dari server ini sendiri.
# Dipakai server block otpnusantara untuk menolak akses langsung ke IP server.
# Rentang Cloudflare sama dengan set_real_ip_from di atas: perbarui bersamaan.
# Alamat privat tidak bisa datang dari internet; isinya cek kesehatan lokal
# (otp_monitor.py: curl --resolve otpnusantara.com:443:127.0.0.1 lewat docker-proxy).
geo $realip_remote_addr $origin_allowed {
    default 0;
    127.0.0.0/8 1;
    ::1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# --- FORMAT LOG ---
# Sama dengan server AWS (lihat nginx/conf.d/00-global.conf) supaya perintah awk
# yang sama tetap berlaku. $remote_addr sudah IP asli (setelah real_ip di atas).
log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host rt=$request_time urt="$upstream_response_time" lr=$limit_req_status';

# --- PEMBATAS REQUEST PER IP ---
# Pagar kasar terhadap scanner/flood sebelum menyentuh Laravel. Batas bisnis
# (kode login, voucher, beli nomor, checkout) tetap dijaga aplikasi per akun/IP.
limit_req_zone $binary_remote_addr zone=otp_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=skyta_per_ip:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;
