# --- KONFIGURASI GLOBAL: SERVER TENCENT (otpnusantara.com) ---
# Di-include dari block http{} nginx:alpine. Prefix "00-" supaya terbaca lebih
# dulu dari otpnusantara.conf yang memakai log_format dan zona di bawah.

# Batas upload disamakan dengan otp-app (nginx & php.ini: 8M).
client_max_body_size 8M;
server_tokens off;

# --- IP ASLI PENGUNJUNG DI BELAKANG CLOUDFLARE ---
# Domain memakai proxy Cloudflare (awan oranye), jadi koneksi ke server datang
# dari IP Cloudflare. IP pengunjung ada di header CF-Connecting-IP, dan header itu
# HANYA dipercaya dari rentang IP Cloudflare di bawah (request langsung ke IP server
# tidak bisa memalsukannya). Tanpa ini rate limit aplikasi (kode login, voucher) dan
# allowlist IP webhook HeroSMS melihat semua orang sebagai beberapa IP Cloudflare.
# Daftar resmi: https://www.cloudflare.com/ips/ (jarang berubah; perbarui bila berubah).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- FORMAT LOG ---
# Sama dengan server AWS (lihat nginx/conf.d/00-global.conf) supaya perintah awk
# yang sama tetap berlaku. $remote_addr sudah IP asli (setelah real_ip di atas).
log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host rt=$request_time urt="$upstream_response_time" lr=$limit_req_status';

# --- PEMBATAS REQUEST PER IP ---
# Pagar kasar terhadap scanner/flood sebelum menyentuh Laravel. Batas bisnis
# (kode login, voucher, beli nomor) tetap dijaga aplikasi per akun/IP.
limit_req_zone $binary_remote_addr zone=otp_per_ip:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;
