# --- otpnusantara.com (Tencent Lighthouse Jakarta) ---
# Cloudflare proxy aktif + SSL/TLS mode "Full (strict)". Sertifikat di server
# adalah Cloudflare Origin Certificate (hanya dipercaya Cloudflare, bukan browser),
# jadi awan oranye WAJIB tetap aktif untuk domain ini.
#
# Upstream otp-app dipanggil lewat variabel + resolver DNS Docker (00-global.conf):
# nginx tetap bisa start walau otp-app belum jalan.
#
# Firewall Lighthouse membuka 80/443 untuk umum (skytastore tidak lewat Cloudflare),
# jadi server block otpnusantara sendiri yang menolak koneksi bukan dari Cloudflare
# ($origin_allowed, 00-global.conf). Tanpa ini WAF Cloudflare bisa dilewati lewat IP server.

# Host tak dikenal (akses langsung via IP, domain lain) ditutup tanpa jawaban.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log main_ext;
    return 444;
}

# Host tak dikenal di 443 (SNI lain atau kosong, akses lewat IP) ditolak saat
# handshake TLS tanpa mengirim sertifikat apa pun. Port 443 terbuka untuk umum
# (skytastore), jadi sertifikat origin yang memuat nama otpnusantara.com tidak boleh
# terlihat oleh scanner yang menyapu IP server (cara umum mencari IP asli di balik
# Cloudflare).
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# HTTP -> HTTPS (Cloudflare biasanya sudah mengalihkan; ini cadangan).
server {
    listen 80;
    server_name otpnusantara.com www.otpnusantara.com;
    access_log /var/log/nginx/access.log main_ext;

    # Hanya lewat Cloudflare atau dari server ini (lihat komentar di atas).
    if ($origin_allowed = 0) {
        return 444;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://otpnusantara.com$request_uri;
    }
}

# www -> domain utama.
server {
    listen 443 ssl;
    http2 on;
    server_name www.otpnusantara.com;

    ssl_certificate /etc/ssl/otpnusantara/origin.pem;
    ssl_certificate_key /etc/ssl/otpnusantara/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log main_ext;

    # Hanya lewat Cloudflare atau dari server ini (lihat komentar di atas).
    if ($origin_allowed = 0) {
        return 444;
    }
    return 301 https://otpnusantara.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name otpnusantara.com;

    ssl_certificate /etc/ssl/otpnusantara/origin.pem;
    ssl_certificate_key /etc/ssl/otpnusantara/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log main_ext;

    # Hanya lewat Cloudflare atau dari server ini (lihat komentar di atas).
    if ($origin_allowed = 0) {
        return 444;
    }

    set $otp_upstream http://otp-app:80;

    # --- Tolak URL khas scanner sebelum sampai ke Laravel ---
    # Pola sama dengan tebu (lihat nginx/conf.d/default.conf). OTP Nusantara tidak
    # punya URL sah berakhiran ekstensi ini atau ber-awalan titik (kecuali
    # .well-known). 444 = koneksi ditutup tanpa jawaban.
    location ~* (?:/\.(?!well-known/)|\.(?:php\d?|phtml|asp|aspx|jsp|cgi|py|sql|bak|old|orig|swp|ini|cfg|conf|ya?ml|env)$|/(?:wp-admin|wp-content|wp-includes|wp-json|wp-login|xmlrpc|phpmyadmin|cgi-bin)) {
        return 444;
    }

    # Aset Vite (nama berisi hash) dilayani nginx di otp-app tanpa PHP: tidak dibatasi.
    location /build/ {
        proxy_pass $otp_upstream;
        include /etc/nginx/conf.d/otp-proxy.inc;
    }

    location / {
        limit_req zone=otp_per_ip burst=40 nodelay;

        proxy_pass $otp_upstream;
        include /etc/nginx/conf.d/otp-proxy.inc;
        proxy_read_timeout 60s;
    }
}
