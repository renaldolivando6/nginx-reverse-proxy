# --- cleogames.id (repo cleogames.id, container cleo-app port 80) ---
# Pola sama dengan otpnusantara.conf: proxy Cloudflare aktif (awan oranye) + SSL/TLS
# "Full (strict)". Sertifikat di server adalah Cloudflare Origin Certificate (hanya
# dipercaya Cloudflare, bukan browser), jadi awan oranye WAJIB tetap aktif.
#
# IP asli pengunjung dari CF-Connecting-IP (00-global.conf), dipakai aplikasi untuk
# rate limit dan allowlist IP webhook Digiflazz lewat TRUSTED_PROXIES = subnet
# web-network. Koneksi yang bukan dari Cloudflare atau server ini ditolak
# ($origin_allowed), lapisan kedua di belakang firewall Lighthouse.

# HTTP -> HTTPS (Cloudflare "Always Use HTTPS" biasanya sudah mengalihkan).
server {
    listen 80;
    server_name cleogames.id www.cleogames.id;
    access_log /var/log/nginx/access.log main_ext;

    if ($origin_allowed = 0) {
        return 444;
    }

    return 301 https://cleogames.id$request_uri;
}

# www -> domain utama.
server {
    listen 443 ssl;
    http2 on;
    server_name www.cleogames.id;

    ssl_certificate /etc/ssl/cleogames/origin.pem;
    ssl_certificate_key /etc/ssl/cleogames/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log main_ext;

    if ($origin_allowed = 0) {
        return 444;
    }
    return 301 https://cleogames.id$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cleogames.id;

    ssl_certificate /etc/ssl/cleogames/origin.pem;
    ssl_certificate_key /etc/ssl/cleogames/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log main_ext;

    if ($origin_allowed = 0) {
        return 444;
    }

    set $cleo_upstream http://cleo-app:80;

    # --- Tolak URL khas scanner sebelum sampai ke Laravel ---
    # Pola sama dengan otpnusantara.conf. Aplikasi tidak punya URL sah berakhiran
    # ekstensi ini atau ber-awalan titik (kecuali .well-known).
    location ~* (?:/\.(?!well-known/)|\.(?:php\d?|phtml|asp|aspx|jsp|cgi|py|sql|bak|old|orig|swp|ini|cfg|conf|ya?ml|env)$|/(?:wp-admin|wp-content|wp-includes|wp-json|wp-login|xmlrpc|phpmyadmin|cgi-bin)) {
        return 444;
    }

    # Aset Vite (nama berisi hash) dilayani nginx di cleo-app tanpa PHP: tidak dibatasi.
    location /build/ {
        proxy_pass $cleo_upstream;
        include /etc/nginx/conf.d/cleo-proxy.inc;
    }

    location / {
        limit_req zone=cleo_per_ip burst=40 nodelay;

        proxy_pass $cleo_upstream;
        include /etc/nginx/conf.d/cleo-proxy.inc;
        # Transaksi supplier ditunggu di job, bukan di request web; 60 detik cukup
        # untuk halaman dan polling invoice.
        proxy_read_timeout 60s;
    }
}
