# --- skytastore.dazytech.web.id, PORT 80 ---
# Saat sertifikat Let's Encrypt belum ada (deploy pertama), deploy/apply.sh
# menyalakan nginx tanpa skytastore.conf (blok 443 yang memakai sertifikat itu),
# tetapi file ini tetap ikut supaya certbot bisa memvalidasi domain. Jadi JANGAN
# taruh blok 443 di file ini.
server {
    listen 80;
    server_name skytastore.dazytech.web.id;
    access_log /var/log/nginx/access.log main_ext;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
