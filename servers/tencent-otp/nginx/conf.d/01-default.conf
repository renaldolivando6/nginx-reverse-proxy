# --- Host tak dikenal (akses lewat IP, domain lain, SNI kosong) ---
# Berlaku untuk semua situs di server ini (otpnusantara.com, cleogames.id). Nama
# "01-" supaya terbaca setelah 00-global.conf (log_format main_ext).

# Port 80: ditutup tanpa jawaban.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log main_ext;
    return 444;
}

# Port 443: ditolak saat handshake TLS tanpa mengirim sertifikat apa pun, jadi
# sertifikat origin yang memuat nama domain tidak terlihat oleh scanner yang
# menyapu IP server (cara umum mencari IP asli di balik Cloudflare).
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
