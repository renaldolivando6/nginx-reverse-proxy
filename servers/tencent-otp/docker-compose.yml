# Reverse proxy server Tencent Lighthouse (otpnusantara.com, cleogames.id).
# Terpisah dari docker-compose.yml di root repo (server AWS). Deploy: deploy-tencent-otp.yml.
services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Cloudflare Origin Certificate per domain (dipasang manual, lihat README).
      - /etc/ssl/otpnusantara:/etc/ssl/otpnusantara:ro
      - /etc/ssl/cleogames:/etc/ssl/cleogames:ro
    networks:
      - web-network

networks:
  web-network:
    external: true
