# Reverse proxy server Tencent Lighthouse (otpnusantara.com, skytastore.dazytech.web.id).
# Terpisah dari docker-compose.yml di root repo (server AWS). Deploy: deploy-tencent-otp.yml.
services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # otpnusantara.com: Cloudflare Origin Certificate (dipasang manual, lihat README).
      - /etc/ssl/otpnusantara:/etc/ssl/otpnusantara:ro
      # Domain tanpa Cloudflare (skytastore.dazytech.web.id): Let's Encrypt,
      # diterbitkan & diperpanjang certbot di container sekali pakai (deploy/apply.sh).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - web-network

networks:
  web-network:
    external: true
