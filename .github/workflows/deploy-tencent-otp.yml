name: Deploy Nginx Reverse Proxy (Tencent TAT - otpnusantara.com, cleogames.id)

# Manual dari tab Actions. Hanya untuk server Tencent Lighthouse (otpnusantara.com,
# cleogames.id, keduanya lewat Cloudflare); server AWS memakai deploy-web-linux.yml
# dan deploy-lb-sb-1.yml. File yang dikirim hanya dari servers/tencent-otp/.
# Sertifikat Cloudflare Origin dipasang manual (servers/tencent-otp/README.md).
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-tencent-otp-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
      TENCENT_REGION: ${{ secrets.TENCENT_REGION }}
      TENCENT_INSTANCE_ID: ${{ secrets.TENCENT_INSTANCE_ID_OTP }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tccli
        run: pip install --quiet tccli

      # Satu bundel tar: file conf baru di nginx/conf.d/ ikut terkirim tanpa
      # mengubah workflow ini.
      - name: Susun skrip deploy
        working-directory: servers/tencent-otp
        run: |
          {
            echo "B64_BUNDLE='$(tar -czf - docker-compose.yml nginx/conf.d | base64 -w 0)'"
            cat deploy/apply.sh
          } > "$GITHUB_WORKSPACE/run.sh"

      - name: Deploy lewat TAT
        run: bash .github/scripts/tat-run.sh run.sh 900
