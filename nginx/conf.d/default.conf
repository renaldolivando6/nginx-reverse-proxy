# --- 1. REDIRECT HTTP KE HTTPS ---
server {
    listen 80;
    server_name sugarcane.sblampung.com dazytech.web.id trans-anugerah-nusa.dazytech.web.id;
    return 301 https://$host$request_uri;
}

# --- 2. KONFIGURASI HTTPS: TEBU (LARAVEL) ---
server {
    listen 443 ssl;
    server_name sugarcane.sblampung.com;

    ssl_certificate /etc/letsencrypt/live/sugarcane.sblampung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sugarcane.sblampung.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://tebu-app:80; # Tembak ke port 80 internal tebu-app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Untuk Reverb / Websocket Laravel
    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://tebu-app:8080; 
    }
}

# --- 3. KONFIGURASI HTTPS: DAZYTECH (NEXT.JS) ---
server {
    listen 443 ssl;
    server_name dazytech.web.id;

    ssl_certificate /etc/letsencrypt/live/dazytech.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dazytech.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://dazytech-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- 4. KONFIGURASI HTTPS: TRANS ANUGERAH NUSA ---
server {
    listen 443 ssl;
    server_name trans-anugerah-nusa.dazytech.web.id;

    ssl_certificate /etc/letsencrypt/live/trans-anugerah-nusa.dazytech.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trans-anugerah-nusa.dazytech.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # PERHATIKAN: Tembak ke trans-nusa-web, BUKAN trans-nusa-app
        proxy_pass http://trans-nusa-app:80; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}