# --- 1. REDIRECT HTTP KE HTTPS ---
server {
    listen 80;
    server_name sugarcane.sblampung.com dazytech.web.id monitoring.dazytech.web.id;

    # Format log: lihat 00-global.conf (wajib di tiap server block, bukan global)
    access_log /var/log/nginx/access.log main_ext;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 2. KONFIGURASI HTTPS: TEBU (LARAVEL) ---
server {
    listen 443 ssl;
    server_name sugarcane.sblampung.com;

    ssl_certificate /etc/letsencrypt/live/sugarcane.sblampung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sugarcane.sblampung.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Batas upload, disamakan dengan tebu-app nginx & php.ini.
    # Sudah di-set global di 00-global.conf, ditulis ulang di sini biar eksplisit.
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log main_ext;

    # --- Tolak URL khas scanner sebelum sampai ke Laravel ---
    # Scanner menebak ribuan URL: file rahasia (.env, .git), skrip bahasa lain
    # (.php, .asp, .py), WordPress (wp-admin, xmlrpc). Tebu tidak punya URL sah
    # berpola begini, tapi tanpa blok ini setiap tebakan menyalakan Laravel penuh
    # hanya untuk menjawab 404.
    #
    # 444 = koneksi ditutup tanpa jawaban (khusus nginx): termurah, dan di log
    # gampang dihitung dengan awk '$9==444'.
    #
    # Sengaja TIDAK memblokir .log: Log Viewer memakai nama file log di URL-nya.
    # Menambah pola = pastikan dulu tidak ada URL tebu yang cocok -- activity code
    # (2.2.7a), nomor dokumen, dan userid ikut muncul di path.
    # Blok ini HARUS di atas blok file statis: regex location dicek berurutan.
    location ~* (?:/\.(?!well-known/)|\.(?:php\d?|phtml|asp|aspx|jsp|cgi|py|sql|bak|old|orig|swp|ini|cfg|conf|ya?ml|env)$|/(?:wp-admin|wp-content|wp-includes|wp-json|wp-login|xmlrpc|phpmyadmin|cgi-bin)) {
        return 444;
    }

    # --- File statis: TIDAK ikut pembatas request ---
    # Daftar ekstensinya SAMA PERSIS dengan blok statis nginx di dalam tebu-app
    # (repo tebu: docker/nginx/default.conf). Di sana file-file ini dilayani nginx
    # langsung tanpa menyentuh PHP, jadi membatasinya tidak melindungi apa pun --
    # hanya memperlambat halaman yang baru pertama dibuka. Kalau daftar di sana
    # berubah, samakan di sini.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://tebu-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Pembatas request per IP -- zona & daftar IP kantor di 00-global.conf.
        # burst=100 nodelay: lonjakan wajar langsung lolos (buka 1 halaman = +-10
        # request sekaligus, termasuk +-6 /broadcasting/auth; sinkron mobile).
        # Yang terus-menerus di atas 10/detik dijawab 429. Scanner 1 Okt (+-47/detik)
        # jadi tertahan di 10/detik.
        #
        # Angka 10/detik + burst 100 diuji dengan memutar ulang log proxy 7 hari
        # (25 Sep-2 Okt 2026): di luar IP kantor yang di-whitelist, tidak ada user
        # sah yang tertolak -- termasuk aplikasi mobile dari jaringan seluler.
        # Menaikkan rate tidak menolong user mana pun, hanya menambah jatah scanner.
        # Perlu mengecek ulang tanpa risiko? Tambahkan `limit_req_dry_run on;`:
        # request tetap dilayani, hanya dicatat lr=REJECTED_DRY_RUN di log.
        limit_req zone=tebu_per_ip burst=100 nodelay;

        proxy_pass http://tebu-app:80; # Tembak ke port 80 internal tebu-app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Untuk Reverb / Websocket Laravel -- tidak dibatasi: 1 koneksi panjang per
    # halaman, bukan request berulang.
    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://tebu-app:8080; 
    }
}

# --- 3. KONFIGURASI HTTPS: DAZYTECH (NEXT.JS) ---
server {
    listen 443 ssl;
    server_name dazytech.web.id;

    ssl_certificate /etc/letsencrypt/live/dazytech.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dazytech.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log main_ext;

    # Sejak Okt 2026 dazytech = Next.js standalone (Node, port 3000) dengan
    # /admin + SQLite, bukan lagi nginx statis di port 80. Deploy app dulu,
    # baru proxy ini (sebelum itu situs 502).
    # Buffer dibesarkan: header respons Next (RSC/server action) bisa melebihi
    # default 4k/8k -> 502 (pelajaran yang sama di osrm-api).
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    location / {
        proxy_pass http://dazytech-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- 4. KONFIGURASI HTTPS: MONITORING (GRAFANA) ---
server {
    listen 443 ssl;
    server_name monitoring.dazytech.web.id;

    ssl_certificate /etc/letsencrypt/live/monitoring.dazytech.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.dazytech.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log main_ext;

    location / {
        proxy_pass http://grafana:3000;   # tembak container grafana lewat web-network
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana pakai websocket utk fitur live
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

