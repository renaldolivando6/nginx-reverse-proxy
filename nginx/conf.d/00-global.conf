# --- KONFIGURASI GLOBAL REVERSE PROXY ---
# File ini di-include dari dalam block http{} pada nginx.conf bawaan image
# nginx:alpine, jadi direktif di sini berlaku untuk SEMUA server block
# (tebu, dazytech, monitoring). Prefix "00-" supaya ter-include paling awal.

# Batas ukuran body request (upload).
# Tanpa direktif ini nginx memakai default 1M, sehingga upload lampiran
# ditolak dengan 413 di proxy sebelum sampai ke container aplikasi.
# Nilai disamakan dengan tebu-app nginx & php.ini (upload_max_filesize 50M).
client_max_body_size 50M;
