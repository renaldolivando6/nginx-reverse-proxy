# --- KONFIGURASI GLOBAL REVERSE PROXY ---
# File ini di-include dari dalam block http{} pada nginx.conf bawaan image
# nginx:alpine, jadi direktif di sini berlaku untuk SEMUA server block
# (tebu, dazytech, monitoring). Prefix "00-" supaya ter-include paling awal.
#
# default.conf BERGANTUNG pada file ini (log_format main_ext, zona tebu_per_ip).
# Kalau file ini tidak ikut ter-deploy, nginx menolak start dan SEMUA situs mati.
# deploy.yml sudah mengirimnya sejak Okt 2026 -- jangan dikeluarkan lagi.

# Batas ukuran body request (upload).
# Tanpa direktif ini nginx memakai default 1M, sehingga upload lampiran
# ditolak dengan 413 di proxy sebelum sampai ke container aplikasi.
# Nilai disamakan dengan tebu-app nginx & php.ini (upload_max_filesize 50M).
client_max_body_size 50M;

# --- FORMAT LOG ---
# Format bawaan "main" milik nginx.conf image + 4 kolom di BELAKANG:
#   host=  domain yang dituju (tebu, dazytech, monitoring lewat proxy yang sama)
#   rt=    durasi request total, detik
#   urt=   durasi menunggu aplikasi; "-" = dijawab proxy sendiri, tidak sampai ke aplikasi
#   lr=    keputusan pembatas request (lihat di bawah); "-" = tidak kena pembatas
#
# Kolom baru SENGAJA di belakang: posisi kolom lama tidak bergeser, jadi perintah
# awk yang sudah dipakai ($1 IP, $4 waktu, $7 URL, $9 status, -F'"' $6 user agent)
# tetap benar.
#
# Dipasang PER SERVER BLOCK (`access_log ... main_ext;` di default.conf), BUKAN di
# sini: nginx.conf bawaan sudah punya `access_log ... main;` di level http, dan dua
# access_log di level yang sama membuat SETIAP request tercatat dua kali.
log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host rt=$request_time urt="$upstream_response_time" lr=$limit_req_status';

# --- PEMBATAS REQUEST PER IP (khusus tebu) ---
# Latar belakang: 1 Okt 2026 22:03 WIB satu scanner (169.58.252.152) mengirim
# 2.795 request dalam 1 menit (+-47/detik) ke ribuan URL acak. Tiap URL tak
# dikenal tetap menyalakan Laravel untuk menjawab 404 -> ke-45 worker php-fpm
# penuh, 2 vCPU habis, user sungguhan ikut antre.
#
# IP kantor DIKECUALIKAN, bukan sekadar dilonggarkan: banyak user keluar lewat
# satu IP, dan di jam sibuk pagi satu IP kantor terukur 577 request/menit
# (+-10/detik) -- persis di batas di bawah. Kunci kosong ("") = request tidak
# dihitung sama sekali oleh limit_req.
#
# Menambah IP kantor: tambahkan baris di geo, lalu deploy. Tanpa itu IP kantor baru
# ikut dibatasi seperti IP lain.
#
# Semua IP kantor di bawah dari rentang ISP PT Global Telecom Utama
# (202.65.224.0/20, whois GTU-ID) -- rentang itu milik ISP, BUKAN milik perusahaan,
# jadi sengaja tidak di-whitelist satu blok utuh. Kalau IT memastikan IP kantor
# berganti-ganti dalam rentang itu (bukan statis), baru pertimbangkan /20-nya.
# Simulasi log 7 hari (25 Sep-2 Okt 2026): selain IP kantor, 2.146 IP / 407 ribu
# request tidak ada satu pun pengguna sah yang tertolak.
geo $tebu_ratelimit_exempt {
    default         0;
    202.65.225.41   1;   # kantor -- ramai 06:00-07:15 WIB. BELUM dikonfirmasi IT
    202.65.238.184  1;   # kantor -- BELUM dikonfirmasi IT
    202.65.239.50   1;   # kantor -- simulasi: 48 request tertolak 30/09 06:29 WIB. BELUM dikonfirmasi IT
    202.65.225.163  1;   # kantor -- simulasi: 3 request tertolak 29/09 06:06 WIB. BELUM dikonfirmasi IT
}

map $tebu_ratelimit_exempt $tebu_ratelimit_key {
    0       $binary_remote_addr;
    1       "";
}

# 10 request/detik per IP; tabungan lonjakannya (`burst`) di-set di default.conf.
# 10m = cukup untuk +-160 ribu IP sekaligus.
limit_req_zone $tebu_ratelimit_key zone=tebu_per_ip:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;
